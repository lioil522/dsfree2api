name: build-docker

# 构建多架构 Docker 镜像并推送到 GitHub Container Registry (ghcr.io)。
# 镜像名：ghcr.io/<owner>/<repo>
# 触发：push 到 main、打 v* 标签、或手动触发（Actions 页 Run workflow）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名跟随仓库名；如需固定为 dsfree2api 可改成:
  # IMAGE_NAME: ${{ github.repository_owner }}/dsfree2api
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

# 同一分支/标签的旧构建直接取消，避免排队
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 分支名（main -> main）
            type=ref,event=branch
            # 标签（v0.6.5 -> 0.6.5 / 0.6 / 0.6.5）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 短提交哈希（永远唯一）
            type=sha,format=short
            # 仅在默认分支打 latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 缓存加速 go mod download / 层缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max
